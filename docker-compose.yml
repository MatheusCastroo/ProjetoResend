services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-projeto_resend}
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-projeto_resend_secret}
      APP_BASE_URL: ""
      DEFAULT_TEST_EMAIL: ${DEFAULT_TEST_EMAIL:-destinatario@exemplo.com}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-projeto_resend_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projeto_resend}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  mysql_data:
